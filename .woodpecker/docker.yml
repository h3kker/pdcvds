when:
  - event: push
    branch: [master,sqlize]
steps:
- name: bauhaus
  image: docker
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  commands:
  - >
    docker build
    --label org.label-schema.build-date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    --label org.label-schema.vcs-url="$DRONE_GIT_HTTP_URL"
    --label org.label-schema.vcs-ref="$DRONE_COMMIT_SHA"
    --label at.ac.vcf.ngs.blame="$DRONE_COMMIT_AUTHOR"
    -t ghcr.io/h3kker/pdcvds .
- name: pushraus
  image: plugins/docker

- name: pushraus
  image: docker
  repo: repo.testha.se/pdcvs
  depends_on:
  - bauhaus